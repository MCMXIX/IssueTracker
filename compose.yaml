x-laravel: &laravel
  image: issue-tracker-app:local
  pull_policy: never
  env_file: .env
  volumes:
    - .:/app
    - dev-vendor:/app/vendor
    - dev-bootstrap-cache:/app/bootstrap/cache
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *laravel
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      vite:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

  horizon:
    <<: *laravel
    command: ["php", "artisan", "horizon:listen", "--poll"]
    init: true
    stop_grace_period: 90s
    volumes:
      - .:/app
      - dev-vendor:/app/vendor
      - dev-bootstrap-cache:/app/bootstrap/cache
      - dev-node-modules:/app/node_modules:ro
    depends_on:
      app:
        condition: service_started
      vite:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  vite:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173 --strictPort
    environment:
      DEV_VITE_ORIGIN: http://localhost:${VITE_DEV_PORT:-5173}
    ports:
      - "127.0.0.1:${VITE_DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  dev-vendor:
  dev-bootstrap-cache:
  dev-node-modules:
